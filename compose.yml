services:
  # ── Core services (always run; no profile) ──────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    # CRITICAL: POSTGRES_PASSWORD/USER/DB come from env_file ONLY, never the
    # `environment:` block. A redundant `environment: POSTGRES_PASSWORD=${...}`
    # entry would re-interpolate at compose level — which picks shell env
    # FIRST, then .env. If anyone has POSTGRES_PASSWORD exported in their
    # shell (from .bashrc, a `source .env`, etc.), shell wins for db while
    # backend reads from env_file — producing a silent mismatch that survives
    # every `down -v`. Don't add them here.
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PGPORT=${POSTGRES_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres} -h 127.0.0.1 -p $${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: '${DOCKER_IMAGE_BACKEND:-backend}:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    # `$$` defers expansion to the container shell (reads .env-loaded values),
    # so BACKEND_BIND_HOST can be flipped to 127.0.0.1 by the hardened-network
    # override fragment without changing this file. Default 0.0.0.0 is correct
    # for bridge mode (docker's network isolation does the work).
    command: ["sh", "-c", "bash /app/prestart.sh && exec uvicorn app.main:app --workers $${BACKEND_WORKERS:-4} --host $${BACKEND_BIND_HOST:-0.0.0.0} --port $${BACKEND_PORT:-8022}"]
    # Deployment config, read directly by AppSettings. Same filename relative
    # to the app root on host and in the container, so there's one path to know.
    volumes:
      - ./my-hq.yml:/app/my-hq.yml:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_PORT:-8022}/api/v1/healthz/liveness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    # Source is baked into the image (see backend/Dockerfile COPY ./app /app/app).
    # The dev source bind lives in compose.override.yml — prod runs the image as-is.

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
      - ./.config/redis.conf:/usr/local/etc/redis/redis.conf
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port ${REDIS_PORT:-6379}
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --rename-command REPLICAOF ""
      --rename-command SLAVEOF ""
    healthcheck:
      # Single $ on purpose: redis gets its password by compose interpolation on
      # the command line, not from env_file, so there is no $REDIS_PASSWORD
      # inside the container for the container shell to expand.
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT:-6379} -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # next.config rewrites() proxies /api to the backend; it needs the port the
    # backend actually binds, which is BACKEND_PORT, not a constant.
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8022}
    # Container always binds 3000 internally; FRONTEND_PORT is the host-side
    # mapping, configurable so setup.sh can bump it when 3000 is in use.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - default

  celery_worker:
    image: '${DOCKER_IMAGE_BACKEND:-backend}:${TAG-latest}'
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    restart: always
    networks:
      - default
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    # -Q matters: this pool used to serve ALL five queues, so four concurrent ingest
    # jobs (the `ingest` task's max_concurrency) saturated it and starved annotate /
    # embed / the beat dispatcher behind hour-long ingests. Heavy content work now has
    # its own pool below; this one keeps the interactive and LLM queues responsive.
    command: ["celery", "-A", "app.core.celery_app.celery", "worker", "--loglevel=info",
              "-P", "prefork", "--concurrency=${CELERY_CONCURRENCY:-4}",
              "-Q", "default,llm,embedding,external_api"]
    volumes:
      - ./my-hq.yml:/app/my-hq.yml:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}
    # Source bind is dev-only (compose.override.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery_worker_processing:
    image: '${DOCKER_IMAGE_BACKEND:-backend}:${TAG-latest}'
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    restart: always
    networks:
      - default
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    # Ingestion and content processing only. Long, bursty, and safe to queue behind
    # itself — isolating it is what keeps a 150k-file import from blocking annotation.
    command: ["celery", "-A", "app.core.celery_app.celery", "worker", "--loglevel=info",
              "-P", "prefork", "--concurrency=${CELERY_PROCESSING_CONCURRENCY:-4}",
              "-Q", "processing"]
    volumes:
      - ./my-hq.yml:/app/my-hq.yml:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}
    # Source bind is dev-only (compose.override.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery_beat:
    image: '${DOCKER_IMAGE_BACKEND:-backend}:${TAG-latest}'
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    restart: always
    networks:
      - default
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    command: >
      celery -A app.core.celery_app.celery beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./my-hq.yml:/app/my-hq.yml:ro
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}
    # Source bind is dev-only (compose.override.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Optional services (opt-in via COMPOSE_PROFILES; see setup.sh) ────────────
  # Object storage. The backend talks plain S3, so this is one deployment
  # option among several — point deployment.services.s3.endpoint at Hetzner or
  # AWS instead and turn this off.
  #
  # Bootstrap (layout, key, bucket) is NOT a sidecar: this image is scratch
  # plus one static binary — no shell to run a script with. ./setup.sh does it
  # over `compose exec` instead, idempotently, on every start.
  #
  # No `ports:`. In bridge mode garage is reachable only as garage:3900 on the
  # compose network; in host mode the generated garage.toml binds HQ_BIND_HOST.
  # Binds live in that file because garage takes them nowhere else.
  garage:
    image: dxflrs/garage:v1.2.0
    profiles: ["garage"]
    restart: always
    # Named, not env_file: a third-party image has no business holding
    # ENCRYPTION_MASTER_KEY or the provider API keys.
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./.config/hq/garage.toml:/etc/garage.toml:ro
      - ./.store/garage/meta:/var/lib/garage/meta
      - ./.store/garage/data:/var/lib/garage/data
    networks:
      - default

  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    restart: always
    volumes:
      - ./.config/searxng:/etc/searxng:ro
      - searxng_data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:${HQ_SEARXNG_PORT:-8888}/
      - GRANIAN_PORT=${HQ_SEARXNG_PORT:-8888}
    networks:
      - default

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
    restart: unless-stopped
    networks:
      - default

  # No `ports:` — deliberately. The image runs gunicorn on 0.0.0.0:8080 and
  # ignores every attempt to change that from outside, so containment is done
  # at the docker level: with nothing published, that 0.0.0.0 reaches no further
  # than this container's own namespace, and the backend talks to it as
  # nominatim:8080 on the compose network. `expose` documents the port without
  # placing it on a host interface.
  #
  # Host network mode has no namespace to contain it — see the nominatim block
  # in .config/hq/compose.host-net.yml for what happens there instead.
  nominatim:
    image: mediagis/nominatim:5.1
    profiles: ["nominatim"]
    restart: always
    expose:
      - "8080"
    shm_size: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2h
    environment:
      # Default: world coarse (admin boundaries: countries, states, cities).
      # Override NOMINATIM_PBF_URL / NOMINATIM_IMPORT_STYLE in .env for detail.
      - PBF_URL=${NOMINATIM_PBF_URL:-https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf}
      - REPLICATION_URL=${NOMINATIM_REPLICATION_URL:-https://planet.openstreetmap.org/replication/day/}
      - IMPORT_STYLE=${NOMINATIM_IMPORT_STYLE:-admin}
      - UPDATE_MODE=none
      - FREEZE=false
      - THREADS=4
      - GUNICORN_WORKERS=4
      - IMPORT_WIKIPEDIA=false
      - IMPORT_GB_POSTCODES=true
      - POSTGRES_SHARED_BUFFERS=2GB
      - POSTGRES_MAINTENANCE_WORK_MEM=4GB
      - POSTGRES_WORK_MEM=50MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=8GB
      - HQ_BIND_HOST=${HQ_BIND_HOST:-127.0.0.1}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    networks:
      - default
    # Admin: ~5GB download, ~2h import | Address (Europe): ~28GB, ~3h | Full: ~60GB, ~8h

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./.config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Defaults here are intentionally non-strict — compose validates ALL
    # services on every command (even profile-gated ones), so a strict
    # `${DOMAIN:?...}` would break `down`, `config`, `ps` etc. when caddy
    # isn't even active. Real validation happens in setup.sh's "Published"
    # path before the caddy profile is enabled.
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - BACKEND_PORT=${BACKEND_PORT:-8022}
      - ACME_EMAIL=${ACME_EMAIL:-}
    depends_on:
      - backend
      - frontend
    networks:
      - default

volumes:
  app-db-data:
  redis_data:
  searxng_data:
  # Deliberately unscoped: model weights are tens of GB, so every checkout on
  # this host shares one cache instead of re-pulling. The cost is that it is NOT
  # namespaced by project — `docker compose down -v` from any HQ checkout takes
  # the models with it. Every other volume here is project-scoped.
  ollama_data:
    name: ollama_data
  nominatim-data:
  nominatim-flatnode:
  caddy_data:
  caddy_config:

networks:
  default:
    external: false

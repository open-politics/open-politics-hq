name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      # Deployment config is a file (.github/hq-ci.yml); only secrets live in env.
      HQ_CONFIG_FILE: ${{ github.workspace }}/.github/hq-ci.yml
      SECRET_KEY: test-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1ub3QtZm9yLXByb2Q=
      POSTGRES_PASSWORD: testpassword
      REDIS_PASSWORD: test-redis-password
      FIRST_SUPERUSER: admin@test.local
      FIRST_SUPERUSER_PASSWORD: testpassword123

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Invariants
        # Supersede cascades and content hashing each live in exactly one
        # place: asset_builder.py. See EXECUTION.md §2.4.
        run: |
          fail=0
          if grep -rn "is_superseded\s*=\s*True" app --include='*.py' \
              | grep -v -e asset_builder.py -e '^app/tests/' -e '^\s*#'; then
            echo "::error::is_superseded=True outside asset_builder.py — use AssetBuilder.supersedes()"
            fail=1
          fi
          if grep -rn "hashlib" app/api/modules/content --include='*.py' \
              | grep -v -e asset_builder.py -e '^\s*#'; then
            echo "::error::hashing under content/ outside asset_builder.py — import content_hash"
            fail=1
          fi
          exit $fail

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          pip install uv==0.12.17
          uv lock --check
          uv sync --frozen --extra dev --no-install-project

      # A service container can't take a command, so no --requirepass there.
      - name: Redis
        run: docker run -d --name redis -p 6379:6379 redis:alpine redis-server --requirepass "$REDIS_PASSWORD"

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: >-
          pytest -v
          app/tests/test_config.py
          app/tests/test_content_types.py
          app/tests/test_filters.py
          app/tests/test_task_decorator.py
          app/tests/test_access_control.py
          app/tests/test_decide.py
          app/tests/test_tree.py
          app/tests/test_user_operations.py
          app/tests/test_processing_pipeline.py
          app/tests/test_feature_workflows.py
          app/tests/test_asset_builder_identity.py
          app/tests/test_intake_repoll.py
          app/tests/test_reconcile_children.py

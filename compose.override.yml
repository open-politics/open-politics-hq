# Dev ergonomics only. Auto-applied by `docker compose` (no -f).
# Production runs `docker compose -f compose.yml ...` which EXCLUDES this file.
# Optional-service topology lives in compose.yml under `profiles:`; this file
# only relaxes restart policy and adds source bind-mounts / live reload.
services:
  db:
    restart: "no"

  backend:
    restart: "no"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8022}:${BACKEND_PORT:-8022}"
    volumes:
      - ./backend/:/app
      - ./backend/openapi.json:/app/openapi.json
      - ./HQ.yml:/app/HQ.yml:ro
    environment:
      - PORT=${BACKEND_PORT:-8022}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "/app/start-reload.sh"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}

  celery_worker:
    restart: "no"
    volumes:
      - ./backend/:/app
      - ./HQ.yml:/app/HQ.yml:ro

  celery_worker_processing:
    restart: "no"
    volumes:
      - ./backend/:/app
      - ./HQ.yml:/app/HQ.yml:ro

  celery_beat:
    restart: "no"
    volumes:
      - ./backend/:/app
      - ./HQ.yml:/app/HQ.yml:ro

  frontend:
    restart: "no"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      # No NEXT_PUBLIC_API_URL: it is inlined into browser JS, where a compose
      # hostname does not resolve. next.config rewrites() proxies /api server-side.
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/app/openapi.json
      - frontend_node_modules:/app/node_modules
      # Read the backend's fixture directly; a copy is not a parity test.
      - ./backend/app/tests/fixtures:/backend/app/tests/fixtures:ro
      # Import the checked-in contract from the docs tree, for the same reason.
      - ./docs/plans/observation-model/schemas:/docs/plans/observation-model/schemas:ro

  # Thin dev overrides for optional services — only materialize when their
  # profile is active (selected in COMPOSE_PROFILES). Base defs are in compose.yml.
  garage:
    restart: "no"
  searxng:
    restart: "no"
  ollama:
    restart: "no"

volumes:
  frontend_node_modules: # convenience for development

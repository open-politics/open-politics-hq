# Dev ergonomics only. Auto-applied by `docker compose` (no -f).
# Production runs `docker compose -f compose.yml ...` which EXCLUDES this file.
# Optional-service topology lives in compose.yml under `profiles:`; this file
# only relaxes restart policy and adds source bind-mounts / live reload.
services:
  db:
    restart: "no"

  backend:
    restart: "no"
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/:/app
      - ./backend/openapi.json:/app/openapi.json
      # local_fs storage bind (when STORAGE_PROVIDER_TYPE=local_fs)
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}
    environment:
      - PORT=${BACKEND_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "/app/start-reload.sh"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    networks:
      - default

  celery_worker:
    restart: "no"
    volumes:
      - ./backend/:/app
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}

  celery_worker_processing:
    restart: "no"
    volumes:
      - ./backend/:/app
      - ${LOCAL_STORAGE_HOST_PATH:-./.store/local_fs}:${LOCAL_STORAGE_BASE_PATH:-/data/storage}

  celery_beat:
    restart: "no"
    volumes:
      - ./backend/:/app

  frontend:
    restart: "no"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:${BACKEND_PORT}
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/app/openapi.json
      - frontend_node_modules:/app/node_modules
      # The convergence parity test reads the backend's fixture directly
      # rather than keeping a copy — a copy is not a parity test, it is the
      # same bug with two homes. Read-only, and mounted at the path the test's
      # `../../../../../../backend/...` resolve() expects, so the suite runs
      # the same from the container as from the host.
      - ./backend/app/tests/fixtures:/backend/app/tests/fixtures:ro
      # `schemaImport.test.ts` imports the checked-in testimony contract from
      # the docs tree — the generated artifact it asserts round-trips — rather
      # than keeping a copy beside itself. Same reasoning as the parity
      # fixture: a copy is not a round-trip test.
      - ./docs/plans/observation-model/schemas:/docs/plans/observation-model/schemas:ro
    networks:
      - default

  # Thin dev overrides for optional services — only materialize when their
  # profile is active (selected in COMPOSE_PROFILES). Base defs are in compose.yml.
  minio:
    restart: "no"
  searxng:
    restart: "no"
  ollama:
    restart: "no"

volumes:
  frontend_node_modules: # convenience for development
